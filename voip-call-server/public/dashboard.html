<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101614">
  <title>Ringio Call Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #e7eee9;
      --muted: #8c9a91;
      --line: #2a3730;
      --surface: #17211b;
      --surface-raised: #1d2a22;
      --page: #101614;
      --mint: #a9efc3;
      --lime: #d4f36a;
      --red: #ff8d7b;
      --mono: "DM Mono", Consolas, monospace;
      --sans: "DM Sans", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: radial-gradient(ellipse at 82% 10%, #26362c 0, transparent 36%), var(--page);
      font-family: var(--sans);
    }
    button { font: inherit; }
    button:disabled { cursor: not-allowed; opacity: .42; }
    .shell { width: min(100% - 40px, 1120px); margin: 0 auto; padding: 30px 0 42px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 700; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; color: #102017; background: var(--lime); border-radius: 8px; }
    .server-state { display: flex; align-items: center; gap: 9px; color: var(--muted); font: 11px var(--mono); }
    .dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: #67736b; }
    .dot.online, .dot.ready { background: var(--mint); }
    .dot.busy { background: var(--lime); }
    .dot.blocked { background: var(--red); }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 52px; padding-top: 38px; }
    .eyebrow { color: var(--mint); font: 10px var(--mono); text-transform: uppercase; }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin: 9px 0 20px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 30px; line-height: 1.15; }
    h2 { font-size: 16px; }
    .count { color: var(--muted); font: 12px var(--mono); white-space: nowrap; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0 0 25px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
    .metric-label { color: var(--muted); font: 10px var(--mono); text-transform: uppercase; }
    .metric-value { margin-top: 6px; font: 22px var(--mono); }
    .list { border-top: 1px solid var(--line); }
    .empty { padding: 18px 0; color: var(--muted); font-size: 13px; }
    .queue-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--line); }
    .queue-number { overflow-wrap: anywhere; font: 16px var(--mono); }
    .queue-caller, .app-meta { margin-top: 6px; color: var(--muted); font: 10px var(--mono); overflow-wrap: anywhere; }
    .wait-time { color: var(--lime); font: 12px var(--mono); white-space: nowrap; }
    .app-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .app-title { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .app-name { overflow-wrap: anywhere; font-size: 14px; font-weight: 600; }
    .app-status { margin-left: auto; color: var(--muted); font: 10px var(--mono); white-space: nowrap; }
    .app-actions { display: flex; align-items: center; gap: 6px; }
    .icon-button, .text-button, .refresh-button { display: inline-grid; min-width: 34px; min-height: 34px; place-items: center; padding: 0 9px; color: var(--ink); background: var(--surface-raised); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
    .icon-button { font-size: 15px; }
    .text-button { font-size: 11px; font-weight: 600; }
    .text-button.blocked { color: var(--mint); }
    .app-rename { display: flex; gap: 6px; min-width: 0; }
    .app-rename input { width: min(38vw, 220px); min-width: 110px; min-height: 34px; padding: 0 8px; color: var(--ink); background: #111a15; border: 1px solid var(--line); border-radius: 6px; }
    .app-rename input:focus { border-color: var(--mint); outline: none; }
    .app-rename button { min-height: 34px; padding: 0 8px; }
    .refresh-button { width: 34px; background: transparent; font-size: 16px; }
    button:hover:not(:disabled) { filter: brightness(1.12); }
    footer { margin-top: 38px; padding-top: 15px; color: #758279; border-top: 1px solid var(--line); font: 10px var(--mono); }
    @media (max-width: 740px) {
      .shell { width: min(100% - 28px, 540px); padding-top: 20px; }
      main { grid-template-columns: 1fr; gap: 38px; padding-top: 30px; }
      .summary { gap: 8px; }
      .metric-label { font-size: 9px; }
      .metric-value { font-size: 19px; }
    }
    @media (max-width: 420px) {
      .app-row { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .app-actions { justify-content: flex-end; }
      .app-status { font-size: 9px; }
      .brand { font-size: 12px; }
      .server-state { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">R</span><span>RINGIO / CALL OPERATIONS</span></div>
      <div class="server-state"><span id="serverDot" class="dot"></span><span id="serverLabel">CONNECTING</span></div>
    </header>
    <main>
      <section aria-labelledby="queueTitle">
        <div class="eyebrow">Routing queue</div>
        <div class="section-heading"><h1 id="queueTitle">Waiting calls</h1><span id="queueCount" class="count">0 calls</span></div>
        <div id="queueList" class="list" aria-live="polite"><p class="empty">Loading queue…</p></div>
      </section>
      <section aria-labelledby="appsTitle">
        <div class="eyebrow">Endpoints</div>
        <div class="section-heading">
          <h1 id="appsTitle">Mobile apps</h1>
          <button id="refreshButton" class="refresh-button" type="button" title="Refresh dashboard" aria-label="Refresh dashboard">↻</button>
        </div>
        <div class="summary" aria-label="Mobile app counts">
          <div><div class="metric-label">Connected</div><div id="connectedCount" class="metric-value">0</div></div>
          <div><div class="metric-label">Available</div><div id="availableCount" class="metric-value">0</div></div>
          <div><div class="metric-label">Busy</div><div id="busyCount" class="metric-value">0</div></div>
          <div><div class="metric-label">Blocked</div><div id="blockedCount" class="metric-value">0</div></div>
        </div>
        <div id="appList" class="list" aria-live="polite"><p class="empty">Loading mobile apps…</p></div>
      </section>
    </main>
    <footer>LIVE ROUTING STATUS · PRIORITY ORDER · CONNECTED APPS REMAIN REGISTERED WHEN BLOCKED</footer>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({ path: '/socket.io', transports: ['websocket'] });
    const queueList = document.getElementById('queueList');
    const appList = document.getElementById('appList');
    let waitTimer;

    function showMessage(element, message) {
      const item = document.createElement('p');
      item.className = 'empty';
      item.textContent = message;
      element.replaceChildren(item);
    }

    function formatWait(seconds) {
      const minutes = Math.floor(seconds / 60);
      return `${minutes}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function updateWaitTimes() {
      document.querySelectorAll('[data-queued-at]').forEach((element) => {
        const seconds = Math.max(0, Math.floor((Date.now() - Date.parse(element.dataset.queuedAt)) / 1000));
        element.textContent = formatWait(seconds);
      });
    }

    async function loadQueue() {
      try {
        const response = await fetch('/api/queued-calls');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const calls = await response.json();
        document.getElementById('queueCount').textContent = `${calls.length} ${calls.length === 1 ? 'call' : 'calls'}`;
        queueList.replaceChildren();
        if (!calls.length) return showMessage(queueList, 'No calls are waiting.');
        calls.forEach((call) => {
          const row = document.createElement('div');
          row.className = 'queue-row';
          const details = document.createElement('div');
          const number = document.createElement('div');
          number.className = 'queue-number';
          number.textContent = call.number;
          const caller = document.createElement('div');
          caller.className = 'queue-caller';
          caller.textContent = `${call.caller} · ${call.mediaSource || 'caller'}`;
          details.append(number, caller);
          const wait = document.createElement('time');
          wait.className = 'wait-time';
          wait.dataset.queuedAt = call.queuedAt;
          wait.dateTime = call.queuedAt;
          wait.textContent = formatWait(call.waitSeconds);
          row.append(details, wait);
          queueList.append(row);
        });
        if (!waitTimer) waitTimer = setInterval(updateWaitTimes, 1000);
      } catch (error) {
        showMessage(queueList, `Could not load waiting calls: ${error.message}`);
      }
    }

    async function setBlocked(app, blocked, button) {
      button.disabled = true;
      try {
        const response = await fetch(`/api/mobile-apps/${encodeURIComponent(app.appId)}/block`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ blocked }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        await Promise.all([loadApps(), loadQueue()]);
      } catch (error) {
        showMessage(appList, `Could not update app: ${error.message}`);
      } finally {
        button.disabled = false;
      }
    }

    function renameApp(app, nameElement) {
      const form = document.createElement('form');
      form.className = 'app-rename';
      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 48;
      input.required = true;
      input.value = app.name;
      input.setAttribute('aria-label', `Name for ${app.name}`);
      const save = document.createElement('button');
      save.className = 'text-button';
      save.type = 'submit';
      save.textContent = 'Save';
      const cancel = document.createElement('button');
      cancel.className = 'text-button';
      cancel.type = 'button';
      cancel.textContent = 'Cancel';
      cancel.addEventListener('click', () => form.replaceWith(nameElement));
      form.append(input, save, cancel);
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = input.value.trim();
        if (!name) {
          input.setCustomValidity('Enter a name.');
          input.reportValidity();
          return;
        }
        input.setCustomValidity('');
        if (name === app.name) return form.replaceWith(nameElement);
        save.disabled = true;
        try {
          const response = await fetch(`/api/mobile-apps/${encodeURIComponent(app.appId)}/name`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          await loadApps();
        } catch (error) {
          showMessage(appList, `Could not rename app: ${error.message}`);
          save.disabled = false;
        }
      });
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') form.replaceWith(nameElement);
      });
      nameElement.replaceWith(form);
      input.focus();
      input.select();
    }

    async function movePriority(app, direction, button) {
      button.disabled = true;
      try {
        const response = await fetch(`/api/mobile-apps/${encodeURIComponent(app.appId)}/priority`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ direction }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        await loadApps();
      } catch (error) {
        showMessage(appList, `Could not update priority: ${error.message}`);
      }
    }

    async function loadApps() {
      try {
        const response = await fetch('/api/mobile-apps');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const apps = await response.json();
        document.getElementById('connectedCount').textContent = apps.length;
        document.getElementById('availableCount').textContent = apps.filter((app) => app.available && !app.blocked).length;
        document.getElementById('busyCount').textContent = apps.filter((app) => app.status === 'busy').length;
        document.getElementById('blockedCount').textContent = apps.filter((app) => app.blocked).length;
        appList.replaceChildren();
        if (!apps.length) return showMessage(appList, 'No mobile apps connected.');
        apps.forEach((app, index) => {
          const row = document.createElement('div');
          row.className = 'app-row';
          const info = document.createElement('div');
          const title = document.createElement('div');
          title.className = 'app-title';
          const dot = document.createElement('span');
          dot.className = `dot ${app.blocked ? 'blocked' : app.status === 'busy' ? 'busy' : 'ready'}`;
          const name = document.createElement('span');
          name.className = 'app-name';
          name.textContent = app.name;
          const status = document.createElement('span');
          status.className = 'app-status';
          status.textContent = app.blocked ? 'BLOCKED' : app.status === 'busy' ? 'BUSY' : 'AVAILABLE';
          title.append(dot, name, status);
          const meta = document.createElement('div');
          meta.className = 'app-meta';
          meta.textContent = `${app.platform.toUpperCase()} · ID ${app.appId.slice(-6)} · PRIORITY ${app.priority}`;
          info.append(title, meta);

          const actions = document.createElement('div');
          actions.className = 'app-actions';
          ['up', 'down'].forEach((direction) => {
            const button = document.createElement('button');
            button.className = 'icon-button';
            button.type = 'button';
            button.textContent = direction === 'up' ? '↑' : '↓';
            button.title = `${direction === 'up' ? 'Increase' : 'Decrease'} priority for ${app.name}`;
            button.setAttribute('aria-label', button.title);
            button.disabled = direction === 'up' ? index === 0 : index === apps.length - 1;
            button.addEventListener('click', () => movePriority(app, direction, button));
            actions.append(button);
          });
          const blockButton = document.createElement('button');
          blockButton.className = `text-button${app.blocked ? ' blocked' : ''}`;
          blockButton.type = 'button';
          blockButton.textContent = app.blocked ? 'Allow' : 'Block';
          blockButton.setAttribute('aria-label', `${app.blocked ? 'Allow' : 'Block'} ${app.name}`);
          blockButton.addEventListener('click', () => setBlocked(app, !app.blocked, blockButton));
          actions.append(blockButton);
          const renameButton = document.createElement('button');
          renameButton.className = 'text-button';
          renameButton.type = 'button';
          renameButton.textContent = 'Rename';
          renameButton.setAttribute('aria-label', `Rename ${app.name}`);
          renameButton.addEventListener('click', () => renameApp(app, name));
          actions.append(renameButton);
          row.append(info, actions);
          appList.append(row);
        });
      } catch (error) {
        showMessage(appList, `Could not load mobile apps: ${error.message}`);
      }
    }

    async function refreshDashboard() {
      await Promise.all([loadApps(), loadQueue()]);
    }

    socket.on('connect', () => {
      document.getElementById('serverDot').classList.add('online');
      document.getElementById('serverLabel').textContent = 'SERVER CONNECTED';
      refreshDashboard();
    });
    socket.on('disconnect', () => {
      document.getElementById('serverDot').classList.remove('online');
      document.getElementById('serverLabel').textContent = 'SERVER OFFLINE';
    });
    socket.on('directory:changed', loadApps);
    socket.on('queue:changed', loadQueue);
    document.getElementById('refreshButton').addEventListener('click', refreshDashboard);
    refreshDashboard();
  </script>
</body>
</html>
